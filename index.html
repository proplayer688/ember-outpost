<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ember Outpost — Rare Friends Universe</title>
    <meta name="description" content="A polished browser-based tactical strategy game in an original Rare Friends-inspired visual universe." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23070A13'/><circle cx='8' cy='8' r='4' fill='%23F59E0B'/><circle cx='8' cy='8' r='2' fill='%23FEF08A'/></svg>" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background-color: #070A13;
        font-family: 'Courier New', Courier, monospace, sans-serif;
        color: #F8FAFC;
        touch-action: none;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      canvas {
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      }

      /* Orientation Prompt Overlay for Portrait Mobile Screens */
      #orientation-prompt {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: rgba(7, 10, 19, 0.94);
        z-index: 999999;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 24px;
        text-align: center;
        backdrop-filter: blur(8px);
      }
      
      @media screen and (orientation: portrait) and (max-width: 900px) {
        body:not(.portrait-dismissed) #orientation-prompt {
          display: flex;
        }
      }

      .prompt-box {
        background: #0D1322;
        border: 2px solid #F59E0B;
        border-radius: 14px;
        padding: 30px 24px;
        max-width: 320px;
        box-shadow: 0 0 40px rgba(245, 158, 11, 0.35);
        animation: fadeIn 0.3s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      .phone-icon-anim {
        font-size: 56px;
        margin-bottom: 16px;
        display: inline-block;
        animation: rotatePhone 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes rotatePhone {
        0%, 15% { transform: rotate(0deg); }
        45%, 65% { transform: rotate(-90deg); }
        85%, 100% { transform: rotate(0deg); }
      }

      .prompt-box h3 {
        color: #F59E0B;
        font-size: 17px;
        font-weight: bold;
        letter-spacing: 1px;
        margin-bottom: 10px;
      }

      .prompt-box p {
        color: #94A3B8;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 22px;
      }

      #dismiss-prompt-btn {
        background: transparent;
        color: #64748B;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 8px 18px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      #dismiss-prompt-btn:hover, #dismiss-prompt-btn:active {
        color: #F8FAFC;
        border-color: #64748B;
        background: rgba(255, 255, 255, 0.05);
      }
    </style>
  </head>
  <body>
    <div id="orientation-prompt">
      <div class="prompt-box">
        <div class="phone-icon-anim">📱</div>
        <h3>ROTATE YOUR PHONE</h3>
        <p>Ember Outpost is a widescreen tactical combat game. <b>Rotate your phone sideways (Landscape)</b> for full-screen gameplay!</p>
        <button id="dismiss-prompt-btn">Play in Portrait Anyway</button>
      </div>
    </div>
    <div id="game-container"></div>
    <script>
      document.getElementById('dismiss-prompt-btn').addEventListener('click', function() {
        document.body.classList.add('portrait-dismissed');
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
